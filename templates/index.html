<!DOCTYPE html>
<html>
<head>
    <title>Water Quality Checker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="card">
        <h1>💧 Water Quality Checker</h1>
        <form method="POST">
            <label>Water Color</label>
            <select name="color">
                <option value="low">Clear</option>
                <option value="medium">Slightly Colored</option>
                <option value="high">Dark / Dirty</option>
            </select>

            <label>Smell</label>
            <select name="smell">
                <option value="low">No Smell</option>
                <option value="medium">Unusual</option>
                <option value="high">Strong / Foul</option>
            </select>

            <label>Clarity</label>
            <select name="clarity">
                <option value="high">Clear</option>
                <option value="medium">Cloudy</option>
                <option value="low">Very Cloudy</option>
            </select>

            <button type="submit">Analyze Water</button>
        </form>

        {% if result %}
        <div class="result-card">
            <div class="result-row">
                <span class="label">Water Color:</span>
                <span class="value">{{ result.color }}</span>
            </div>
            <div class="result-row">
                <span class="label">Smell:</span>
                <span class="value">{{ result.smell }}</span>
            </div>
            <div class="result-row">
                <span class="label">Clarity:</span>
                <span class="value">{{ result.clarity }}</span>
            </div>
            <div class="result-row">
                <span class="label">Level:</span>
                <span class="value">{{ result.level }}</span>
            </div>
            <div class="result-row">
                <span class="label">Suggestion:</span>
                <span class="value">{{ result.suggestion }}</span>
            </div>
        </div>
        {% endif %}
    </div>
</div>
</body>
                </html>
